<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="theme-color" content="#05060f">
  <title>The Revenge of the Travas</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden;
                 touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #juego { width: 100%; height: 100%; }
    /* En celular vertical: pedir que lo giren */
    #girar { display: none; position: fixed; inset: 0; z-index: 10; background: #05060f; color: #fff;
             font: 700 22px/1.4 "Arial Black", sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
    #girar span { display: block; font-size: 64px; margin-bottom: 12px; animation: girar 1.6s ease-in-out infinite; }
    @keyframes girar { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="girar"><div><span>📱</span>Girá el teléfono<br>para jugar</div></div>
  <script src="lib/phaser.min.js"></script>
  <script src="src/assets-data.js"></script>
  <script src="src/config-juego.js"></script>
  <script src="src/datos.js"></script>
  <script src="src/sonido.js"></script>
  <script src="src/luchador.js"></script>
  <script src="src/tactil.js"></script>
  <script src="src/escenas-menu.js"></script>
  <script src="src/escena-nivel.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
